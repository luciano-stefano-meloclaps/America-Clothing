services:
  db:
    image: mysql:8.0
    container_name: vintage_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: VintageDB
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DataBase:/docker-entrypoint-initdb.d
    networks:
      - vintage_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vintage_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__connection=Server=db;Port=3306;Database=VintageDB;User=user;Password=password;
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "5000:80"
    volumes:
      - ./DataBase:/app/SeedData
    networks:
      - vintage_network

  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: vintage_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - vintage_network

volumes:
  mysql_data:
    driver: local

networks:
  vintage_network:
    driver: bridge
